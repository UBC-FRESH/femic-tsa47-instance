[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femic-tsa47-instance"
version = "0.1.0"
description = "FEMIC and ws4 model instance for TSA 47"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
freshforge = ["freshforge>=0.1.0a5"]

[project.entry-points."freshforge.providers"]
tsa47_ws4 = "tsa47_workflow:provider_factory"

[tool.setuptools.packages.find]
where = ["src"]

# Tool configuration for the UBC-FRESH dev workflow. This repository is a seed and
# documentation kit, not a Python package, so there is no [project] table. Each gate
# configured here is also a check in the green dashboard (scripts/dashboard.py).

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "src", "tests"]
extend-exclude = ["tmp", "_build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/tsa47_workflow/**" = ["ANN401"]
"templates/project/tests/**" = ["D"]
"docs/conf.py" = ["D", "ANN", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "scripts:src"
files = ["scripts", "src", "tests", "docs/conf.py"]

[[tool.mypy.overrides]]
module = ["numpydoc", "numpydoc.*", "yaml", "yaml.*", "femic", "femic.*", "freshforge", "freshforge.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "pandas",
  "pandas.*",
  "geopandas",
  "geopandas.*",
  "shapely",
  "shapely.*",
  "pyarrow",
  "pyarrow.*",
  "fiona",
  "fiona.*",
  "pyogrio",
  "pyogrio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["scripts"]
# The opening scheduler is a data-shaped search; its output is verified
# end-to-end in the opening-first runtime run, not by unit coverage.
omit = ["scripts/build_opening_schedule.py"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
