# Great Bear Rainforest South TSA 47 benchmark targets.
#
# The Great Bear Rainforest (Forest Management) Act and B.C. Reg. 328/2016 set
# the AAC for the Crown land in the GBR South TSA at 830,500 m3/yr, effective
# January 1, 2017. Product accounts accumulate over a target period, so each
# decade target is 10 * 830,500 = 8,305,000 m3. The lower and upper bounds ask
# whether the model can hold the legal AAC across the full horizon, not only in
# the first decade.
targets:
  - account: product.Yield.managed.Total
    period: 1
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 1, offsets 0-9."
  - account: product.Yield.managed.Total
    period: 2
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 2, offsets 10-19."
  - account: product.Yield.managed.Total
    period: 3
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 3, offsets 20-29."
  - account: product.Yield.managed.Total
    period: 4
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 4, offsets 30-39."
  - account: product.Yield.managed.Total
    period: 5
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 5, offsets 40-49."
  - account: product.Yield.managed.Total
    period: 6
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 6, offsets 50-59."
  - account: product.Yield.managed.Total
    period: 7
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 7, offsets 60-69."
  - account: product.Yield.managed.Total
    period: 8
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 8, offsets 70-79."
  - account: product.Yield.managed.Total
    period: 9
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 9, offsets 80-89."
  - account: product.Yield.managed.Total
    period: 10
    period_width: 10
    minimum: 8305000
    maximum: 8306000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 10, offsets 90-99."
