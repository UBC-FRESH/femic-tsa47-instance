# TSR-consistent TIPSY rule scaffold. The production lane is
# scripts/build_tsr_lane.sh; this file preserves the reviewed assumptions for
# the config-driven FEMIC pipeline.
schema_version: 1
tsa_code: '47'
metadata:
  source_tsr:
  - title: Kingcome TSA Timber Supply Review 3 Data Package
    year: 2010
    url: https://www.for.gov.bc.ca/ftp/HTS/external/!publish/Timber_Supply_Review/TSA/Kingcome_33/TSR_2010/Data_Package/Kingcome_TSA_TSR3_Data_Package_final.pdf
    notes: 'Tables 47-48: planted regeneration at 1,000 stems/ha, regeneration delay 1 year, OAF1 15%, OAF2 5%.'
  - title: Strathcona TSA Timber Supply Review 3 Data Package
    year: 2005
    url: https://www.for.gov.bc.ca/ftp/HTS/external/!publish/Timber_Supply_Review/TSA/Strathcona_37/TSR_2005/Data_Package/37ts03dp.pdf
    notes: 'Table 21: regeneration assumptions for managed stands; OAF1 15%, OAF2 5%.'
  author: UBC FRESH Lab
  created_utc: '2026-10-24T00:00:00+00:00'
  notes: Per-AU species mixes are derived from the calibrated VRI checkpoint by scripts/build_tsr_tipsy_input.py. This rule is the fallback for the legacy config-driven pipeline.
defaults:
  e:
    OAF1: 0.85
    OAF2: 0.95
    FIZ: I
    Regen_Method: P
    Proportion: 1
    Regen_Delay: 1
    Density: 1000
    SPP_1: Hw
    PCT_1: 50
    SPP_2: Cw
    PCT_2: 30
    SPP_3: Ba
    PCT_3: 20
  f:
    OAF1: 0.85
    OAF2: 0.95
    FIZ: I
    Regen_Method: P
    Proportion: 1
    Regen_Delay: 1
    Density: 1000
    SPP_1: Hw
    PCT_1: 50
    SPP_2: Cw
    PCT_2: 30
    SPP_3: Ba
    PCT_3: 20
    SI_c1: 1.0
    SI_c2: 0.0
rules:
- id: gbr_tsr_default
  when: {}
  assign:
    e:
      OAF1: 0.85
      OAF2: 0.95
      FIZ: I
      Regen_Method: P
      Proportion: 1
      Regen_Delay: 1
      Density: 1000
      SPP_1: Hw
      PCT_1: 50
      SPP_2: Cw
      PCT_2: 30
      SPP_3: Ba
      PCT_3: 20
    f:
      OAF1: 0.85
      OAF2: 0.95
      FIZ: I
      Regen_Method: P
      Proportion: 1
      Regen_Delay: 1
      Density: 1000
      SPP_1: Hw
      PCT_1: 50
      SPP_2: Cw
      PCT_2: 30
      SPP_3: Ba
      PCT_3: 20
      SI_c1: 1.0
      SI_c2: 0.0
